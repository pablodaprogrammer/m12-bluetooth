<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIMOTEC 20/30 Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0e13;
      color: #f4f7fb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      width: min(720px, 92vw);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    h1 { margin: 0; text-align: center; font-size: clamp(26px, 6vw, 38px); }
    .subtitle { margin: 8px 0 24px; color: #98a2b3; text-align: center; }

    .card {
      margin: 14px 0;
      padding: 18px;
      border: 1px solid #293140;
      border-radius: 18px;
      background: #171c25;
      box-shadow: 0 14px 34px rgb(0 0 0 / 20%);
    }

    .status { margin-bottom: 14px; text-align: center; color: #aeb7c6; }
    .ok { color: #63e18b; }
    .warn { color: #ffd05d; }
    .bad { color: #ff7c7c; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 14px;
      border-radius: 13px;
      background: #090c11;
    }

    .label { color: #8e99aa; font-size: 12px; }
    .value { margin-top: 5px; font-size: 24px; font-weight: 750; }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #287cff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: .35; }
    .set30 { background: #d06b24; }
    .set20 { background: #35a866; }
    .disconnect { background: #4d5663; }

    .note {
      color: #a7b0bf;
      font-size: 13px;
      line-height: 1.55;
    }

    #result, #log {
      margin: 12px 0 0;
      padding: 13px;
      border-radius: 12px;
      background: #090c11;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #result { min-height: 48px; text-align: center; }
    #log { max-height: 260px; overflow: auto; color: #aeb7c6; font: 12px/1.45 ui-monospace, monospace; }

    @media (max-width: 520px) {
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
