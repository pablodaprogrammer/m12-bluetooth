<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escooter BLE Test</title>

<style>

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #101217;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 650px;

    background: #1b1f27;

    border-radius: 20px;

    padding: 25px;

    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
}

.status {
    background: #11151b;

    padding: 15px;

    border-radius: 12px;

    margin: 20px 0;

    white-space: pre-wrap;

    word-break: break-word;
}

button {
    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: 0;

    border-radius: 12px;

    background: #287cff;

    color: white;

    font-size: 16px;

    font-weight: bold;
}

button:disabled {
    opacity: .5;
}

.service {
    background: #11151b;

    border-radius: 12px;

    padding: 15px;

    margin-top: 12px;
}

.characteristic {
    padding: 10px 0;

    color: #bbb;

    font-size: 14px;

    border-top: 1px solid #292e36;
}

.uuid {
    font-family: monospace;

    color: #6fa1ff;

    word-break: break-all;
}

</style>
</head>


<body>


<div class="container">


<h1>
🛴 Escooter BLE Test
</h1>


<button id="connect">

🔵 Bluetooth verbinden

</button>


<button
id="disconnect"
disabled>

🔌 Trennen

</button>


<div
id="status"
class="status">

Bereit.

Drücke „Bluetooth verbinden“.

</div>


<div id="services"></div>


</div>



<script>


let device = null;

let server = null;


const connectButton =
document.getElementById("connect");


const disconnectButton =
document.getElementById("disconnect");


const status =
document.getElementById("status");


const services =
document.getElementById("services");



function setStatus(text) {

    status.textContent = text;

}



/* Bluetooth verbinden */


connectButton.addEventListener(
"click",

async function() {

    try {

        services.innerHTML = "";


        setStatus(
            "🔍 Suche nach Bluetooth-Geräten..."
        );


        /*
         * KEIN Namensfilter.
         *
         * Dadurch sollte wieder genau
         * die Bluetooth-Auswahl erscheinen,
         * die bei dir vorher funktioniert hat.
         */

        device =
        await navigator.bluetooth.requestDevice({

            acceptAllDevices: true,

            optionalServices: []

        });


        setStatus(

            "📱 Gerät ausgewählt:\n\n" +

            (
                device.name ||
                "Unbekannt"
            ) +

            "\n\n🔵 Verbinde..."

        );


        device.addEventListener(

            "gattserverdisconnected",

            function() {

                setStatus(
                    "🔴 Bluetooth-Verbindung getrennt."
                );

                connectButton.disabled =
                    false;

                disconnectButton.disabled =
                    true;

            }

        );


        if (!device.gatt) {

            throw new Error(
                "GATT wird von diesem Gerät nicht unterstützt."
            );

        }


        server =
        await device.gatt.connect();


        setStatus(

            "🟢 Verbunden!\n\n" +

            "Gerät: " +

            (
                device.name ||
                "Unbekannt"
            ) +

            "\n\n" +

            "Suche nach BLE-Services..."

        );


        /*
         * Services auslesen.
         *
         * Wir schreiben NICHTS.
         */

        const serviceList =
        await server.getPrimaryServices();


        if (
            serviceList.length === 0
        ) {

            setStatus(

                "⚠️ Verbindung funktioniert,\n" +
                "aber keine Primary Services gefunden."

            );

        }


        /*
         * Services anzeigen
         */

        for (
            const service of serviceList
        ) {


            const serviceBox =
            document.createElement("div");


            serviceBox.className =
            "service";


            serviceBox.innerHTML =

                "<strong>BLE Service</strong><br><br>" +

                "<span class='uuid'>" +

                service.uuid +

                "</span>";


            services.appendChild(
                serviceBox
            );


            try {


                const characteristics =
                await service.getCharacteristics();


                for (
                    const characteristic
                    of characteristics
                ) {


                    const charBox =
                    document.createElement("div");


                    charBox.className =
                    "characteristic";


                    charBox.innerHTML =

                        "<strong>Characteristic</strong><br>" +

                        "<span class='uuid'>" +

                        characteristic.uuid +

                        "</span><br><br>" +

                        "Eigenschaften: " +

                        characteristic.properties.join(", ");


                    serviceBox.appendChild(
                        charBox
                    );

                }


            }

            catch(error) {


                const errorBox =
                document.createElement("div");


                errorBox.className =
                "characteristic";


                errorBox.textContent =
                    "Characteristics konnten nicht gelesen werden.";


                serviceBox.appendChild(
                    errorBox
                );

            }

        }


        connectButton.disabled =
            true;


        disconnectButton.disabled =
            false;


        setStatus(

            "✅ Fertig!\n\n" +

            "Gerät: " +

            (
                device.name ||
                "Unbekannt"
            ) +

            "\n\n" +

            "BLE-Services wurden ausgelesen.\n" +

            "Es wurden keine Daten geschrieben."

        );

    }


    catch(error) {


        console.error(error);


        connectButton.disabled =
            false;


        setStatus(

            "❌ Fehler:\n\n" +

            error.name +

            "\n" +

            error.message

        );

    }

});



/* Trennen */


disconnectButton.addEventListener(
"click",

function() {

    if (

        device &&

        device.gatt &&

        device.gatt.connected

    ) {

        device.gatt.disconnect();

    }

});

</script>


</body>
</html>
