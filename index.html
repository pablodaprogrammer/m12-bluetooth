<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escooter BLE Scanner</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #101217;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 650px;
    background: #1b1f27;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
}

.status {
    background: #11151b;
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0;
    white-space: pre-wrap;
    word-break: break-word;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: #287cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
}

.service {
    background: #11151b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.characteristic {
    padding: 8px 0;
    color: #bbb;
    font-size: 14px;
    border-top: 1px solid #292e36;
}

.uuid {
    font-family: monospace;
    color: #6fa1ff;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="container">

<h1>🛴 Escooter BLE Scanner</h1>

<button id="connect">
🔵 Escooter verbinden
</button>

<button id="disconnect" disabled>
🔌 Trennen
</button>

<div id="status" class="status">
Bereit.
</div>

<div id="services"></div>

</div>


<script>

let device = null;
let server = null;


const connectButton =
    document.getElementById("connect");

const disconnectButton =
    document.getElementById("disconnect");

const status =
    document.getElementById("status");

const services =
    document.getElementById("services");


function log(text) {

    status.textContent = text;

}


connectButton.addEventListener(
    "click",
    async () => {

        try {

            services.innerHTML = "";

            log(
                "🔍 Suche nach Bluetooth-Geräten..."
            );


            device =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            name: "Escooter"
                        }
                    ],

                    optionalServices: []

                });


            log(
                "📱 Gefunden:\n" +
                (device.name || "Unbekannt") +
                "\n\n🔵 Verbinde..."
            );


            device.addEventListener(
                "gattserverdisconnected",
                () => {

                    log(
                        "🔴 Verbindung getrennt."
                    );

                    connectButton.disabled =
                        false;

                    disconnectButton.disabled =
                        true;

                }
            );


            server =
                await device.gatt.connect();


            log(
                "🟢 Verbunden!\n\n" +
                "Suche BLE-Services..."
            );


            /*
             * Wir holen nur die Services.
             * Es werden keine Werte geschrieben.
             */

            const serviceList =
                await server.getPrimaryServices();


            if (serviceList.length === 0) {

                log(
                    "⚠️ Keine Primary Services gefunden."
                );

                return;

            }


            for (
                const service of serviceList
            ) {

                const serviceBox =
                    document.createElement("div");

                serviceBox.className =
                    "service";


                serviceBox.innerHTML =
                    "<strong>Service</strong><br>" +
                    "<span class='uuid'>" +
                    service.uuid +
                    "</span>";


                services.appendChild(
                    serviceBox
                );


                try {

                    const chars =
                        await service.getCharacteristics();


                    for (
                        const characteristic
                        of chars
                    ) {

                        const charBox =
                            document.createElement("div");

                        charBox.className =
                            "characteristic";


                        charBox.innerHTML =
                            "Characteristic:<br>" +
                            "<span class='uuid'>" +
                            characteristic.uuid +
                            "</span><br><br>" +
                            "Eigenschaften: " +
                            characteristic.properties
                            .join(", ");


                        serviceBox.appendChild(
                            charBox
                        );

                    }

                }

                catch (error) {

                    const errorBox =
                        document.createElement("div");

                    errorBox.className =
                        "characteristic";

                    errorBox.textContent =
                        "Characteristics konnten nicht gelesen werden.";

                    serviceBox.appendChild(
                        errorBox
                    );

                }

            }


            disconnectButton.disabled =
                false;

            connectButton.disabled =
                true;


            log(
                "✅ Fertig!\n\n" +
                "Die BLE-Struktur wurde ausgelesen.\n" +
                "Es wurden keine Daten geschrieben."
            );

        }

        catch (error) {

            console.error(error);

            log(
                "❌ Fehler:\n\n" +
                error.message
            );

            connectButton.disabled =
                false;

        }

    }
);


disconnectButton.addEventListener(
    "click",
    () => {

        if (
            device &&
            device.gatt &&
            device.gatt.connected
        ) {

            device.gatt.disconnect();

        }

    }
);

</script>

</body>
</html>
